# Integration tests run against a disposable PostgreSQL 17 container started by the
# Testcontainers JDBC driver (requires a running Docker daemon). TC_DAEMON keeps the
# container alive across the cached Spring contexts of a test run.
spring.datasource.url=${TEST_DB_URL:jdbc:tc:postgresql:17-alpine:///autoparts?TC_DAEMON=true}
spring.datasource.username=${TEST_DB_USERNAME:autoparts}
spring.datasource.password=${TEST_DB_PASSWORD:autoparts}

# The real lookup provider is never called in tests; keep the limiter out of the way
# of suites that share one application context.
vehicle-lookup.rate-limit.max-requests=1000
auth.rate-limit.max-requests=1000
# Expiry is exercised by calling OrderService directly.
orders.expiry-job.enabled=false
mercadopago.webhook-secret=test-webhook-secret
