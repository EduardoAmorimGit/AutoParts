spring.application.name=autoparts-maven
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/autoparts}
spring.datasource.username=${DB_USERNAME:autoparts}
spring.datasource.password=${DB_PASSWORD:autoparts}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

simples-api.base-url=${SIMPLES_API_BASE_URL:https://api.simplesapi.com.br}
simples-api.plate-path=${SIMPLES_API_PLATE_PATH:/v1/vehicle/plate}
simples-api.api-key=${SIMPLES_API_KEY:}
simples-api.connect-timeout-seconds=2
simples-api.read-timeout-seconds=5

# Per-client (IP) limit of paid provider lookups. Stored vehicles do not count.
vehicle-lookup.rate-limit.max-requests=${VEHICLE_LOOKUP_RATE_LIMIT:10}
vehicle-lookup.rate-limit.window=${VEHICLE_LOOKUP_RATE_WINDOW:1m}

# JWT (self-issued). JWT_SECRET: at least 32 bytes; required with the prod profile.
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.issuer=autoparts
auth.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
auth.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:30d}

# Login/registration attempts per client IP.
auth.rate-limit.max-requests=${AUTH_RATE_LIMIT:10}
auth.rate-limit.window=${AUTH_RATE_WINDOW:1m}

# Fitment CSV imports (admin).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Delivery area (city of Rio de Janeiro by CEP range; comma-separated ranges allowed).
delivery.cep-ranges=${DELIVERY_CEP_RANGES:20000000-23799999}
delivery.city=Rio de Janeiro
delivery.state=RJ

# Unpaid orders are cancelled (stock returned) after this time.
orders.payment-timeout=${ORDER_PAYMENT_TIMEOUT:30m}
orders.expiry-job.interval=PT1M
