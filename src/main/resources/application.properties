spring.application.name=autoparts-maven
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/autoparts}
spring.datasource.username=${DB_USERNAME:autoparts}
spring.datasource.password=${DB_PASSWORD:autoparts}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

simples-api.base-url=${SIMPLES_API_BASE_URL:https://api.simplesapi.com.br}
simples-api.plate-path=${SIMPLES_API_PLATE_PATH:/v1/vehicle/plate}
simples-api.api-key=${SIMPLES_API_KEY:}
simples-api.connect-timeout-seconds=2
simples-api.read-timeout-seconds=5

# Per-client (IP) limit of paid provider lookups. Stored vehicles do not count.
vehicle-lookup.rate-limit.max-requests=${VEHICLE_LOOKUP_RATE_LIMIT:10}
vehicle-lookup.rate-limit.window=${VEHICLE_LOOKUP_RATE_WINDOW:1m}

# JWT (self-issued). JWT_SECRET: at least 32 bytes; required with the prod profile.
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.issuer=autoparts
auth.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
auth.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:30d}

# Login/registration attempts per client IP.
auth.rate-limit.max-requests=${AUTH_RATE_LIMIT:10}
auth.rate-limit.window=${AUTH_RATE_WINDOW:1m}

# Password reset ("esqueci minha senha"): link lifetime and minimum time between two links per account.
# PASSWORD_RESET_URL is the store page that reads the token from the URL fragment (#token=...);
# blank = ${STORE_SITE_URL}/redefinir-senha.
auth.password-reset.ttl=${PASSWORD_RESET_TTL:30m}
auth.password-reset.cooldown=${PASSWORD_RESET_COOLDOWN:1m}
auth.password-reset.url=${PASSWORD_RESET_URL:}

# Fitment CSV imports (admin).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Delivery area (city of Rio de Janeiro by CEP range; comma-separated ranges allowed).
delivery.cep-ranges=${DELIVERY_CEP_RANGES:20000000-23799999}
delivery.city=Rio de Janeiro
delivery.state=RJ

# CEP verification (ViaCEP, free, no key): district, city and state of addresses come from it.
cep-lookup.base-url=${CEP_LOOKUP_BASE_URL:https://viacep.com.br}
cep-lookup.connect-timeout=2s
cep-lookup.read-timeout=4s

# Unpaid orders are cancelled (stock returned) after this time.
orders.payment-timeout=${ORDER_PAYMENT_TIMEOUT:30m}
orders.expiry-job.interval=PT1M

# Mercado Pago (credentials only from environment variables; gateway disabled when the token is blank).
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}
# Card installments accepted (1 = only lump sum; installment fees are a business decision).
payments.max-installments=1

# E-mail (Brevo SMTP relay). Without BREVO_SMTP_LOGIN/BREVO_SMTP_KEY e-mails are only logged.
# Every e-mail is first stored in email_outbox (same transaction as the order change) and sent by a job.
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_LOGIN:}
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# The SMTP health check would report DOWN whenever Brevo is slow or not configured.
management.health.mail.enabled=false
# Seller identification required by Decreto 7.962/2013 (shown in e-mails and legal documents).
store.name=${STORE_NAME:AutoParts}
store.legal-name=${STORE_LEGAL_NAME:}
store.cnpj=${STORE_CNPJ:}
store.address=${STORE_ADDRESS:}
store.support-email=${STORE_SUPPORT_EMAIL:}
store.support-phone=${STORE_SUPPORT_PHONE:}
store.site-url=${STORE_SITE_URL:}
# Version of the terms/policies (src/main/resources/legal) accepted at checkout. Bump it whenever a
# document changes; each order stores the version it was sold under.
legal.terms-version=2026-11-24
# Returns: withdrawal window in days after delivery (never below the legal 7) and the time the
# admins have to answer a request before it shows as overdue.
returns.withdrawal-days=7
returns.answer-deadline=P2D
notifications.email.from=${MAIL_FROM:no-reply@autoparts.local}
notifications.email.from-name=${MAIL_FROM_NAME:AutoParts}
notifications.email.dispatch-interval=PT15S
notifications.email.max-attempts=5

# Local secrets: values from a .env file in the working directory (project root), when it exists.
# .env is gitignored; copy .env.example to .env and fill it in. Real environment variables still
# win. The Maven test run points AUTOPARTS_ENV_FILE elsewhere, so a developer's real keys never
# reach the tests. (A profile-gated "#---" document here made tests skip this whole file.)
spring.config.import=optional:file:${AUTOPARTS_ENV_FILE:.env}[.properties]
