spring.application.name=autoparts-maven
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/autoparts}
spring.datasource.username=${DB_USERNAME:autoparts}
spring.datasource.password=${DB_PASSWORD:autoparts}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

simples-api.base-url=${SIMPLES_API_BASE_URL:https://api.simplesapi.com.br}
simples-api.plate-path=${SIMPLES_API_PLATE_PATH:/v1/vehicle/plate}
simples-api.api-key=${SIMPLES_API_KEY:}
simples-api.connect-timeout-seconds=2
simples-api.read-timeout-seconds=5